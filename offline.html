<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Offline | Prime Imperial Trade</title>
    <style>
        body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111827;color:#e5e7eb;font-family:Arial,sans-serif;text-align:center;padding:24px}
        .card{max-width:460px;background:#1f2937;border:1px solid #374151;border-radius:18px;padding:32px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
        img{width:84px;height:84px;border-radius:50%;margin-bottom:18px}
        h1{margin:0 0 10px;font-size:26px;color:#fff}
        p{margin:0;line-height:1.6;color:#cbd5e1}
        button{margin-top:22px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700;padding:12px 20px;cursor:pointer}
    </style>
</head>
<body>
    <div class="card">
        <img src="/dash/bitcoin-btc-logo.png" alt="Bitcoin logo">
        <h1>You are offline</h1>
        <p>Reconnect to the internet to continue using Prime Imperial Trade.</p>
        <button onclick="location.reload()">Try Again</button>
    </div>
</body>
</html>
